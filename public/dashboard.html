<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Radar F1</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/dashboard.css">

</head>
<body onload="carregar()">
    <main>
        <section class="menu">
            <h2 class="texto-menu">Olá, <span id="nome_usuario">-</span></h2>
            <ul>
                <li><a href="dashboard.html" class="link-menu"><strong>Dashboard</strong></a></li>
                <li><a href="quiz.html" class="link-menu">Quiz</a></li>
            </ul>
            <a class="btn-sair" onclick="limparSessao()" href="index.html">Sair</a>
        </section>
        <section class="container-principal">
            <article class="container-kpi">
                <div class="kpi">Total de fãs utilizando o site <span id="kpiTotal"></span></div>
                <div class="kpi">Equipe mais popular <span id="kpiEquipe"></span></div>
                <div class="kpi">Piloto do Grid Atual Favorito <span id="kpiPiloto"></span></div>
                <div class="kpi">Porcentagem de Acertos no Quiz <span id="kpiQuiz"></span></div>
            </article>
            <article class="container-dashboard">
                <div class="grafico">
                    <h2>Top 5 Equipes Favoritas</h2>
                    <canvas id="graficoEquipeFavorita"></canvas>
                </div>
                <div class="grafico">
                    <h2>Top 5 Pilotos Favoritos</h2>
                    <canvas id="graficoPilotoFavorito"></canvas>
                </div>
                <div class="grafico">
                    <h2>Tempo de Acompanhamento dos Fãs</h2>
                    <canvas id="graficoTempoAcompanhamento"></canvas>
                </div>
                <div class="grafico">
                    <h2>Tempo de Acompanhamento por Equipe</h2>
                    <select id="selectTempo" onchange="buscarEquipeTempo()">
                        <option value="1">Menos de 1 ano</option>
                        <option value="2">Entre 1 a 3 anos</option>
                        <option value="3">Entre 3 a 5 anos</option>
                        <option value="4">Entre 5 e 10 anos</option>
                        <option value="5">Mais de 10 anos</option>
                    </select>
                    <canvas id="graficoEquipeTempo"></canvas>
                </div>
            </article>
        </section>
    </main>
    <script>
        const nome = sessionStorage.getItem('NOME_USUARIO');

        function carregar() {
            const menuNome = document.getElementById('nome_usuario');

            if (nome != null) {
                menuNome.innerHTML = nome;
            } else {
                menuNome.innerHTML = "usuário";
            }

            buscarKpis();
            buscarGraficoEquipes();
            buscarGraficoPilotos();
            buscarGraficoTempo();
            buscarEquipeTempo();
        }

        // Funções para puxar dados da KPI

        function buscarKpis() {

            fetch("/dados/dashboard/kpi/usuarios", { cache: 'no-store' })
                .then(function (response) {
                    if (response.ok) {
                        response.json().then(function (resposta) {

                            console.log(`Dados KPI Usuários: ${JSON.stringify(resposta)}`);
                            kpiTotal.innerHTML = resposta[0].total;

                        });
                    } else {
                        console.error("Erro ao buscar KPI de usuários.");
                    }
                })
                .catch(function (erro) {
                    console.error(`Erro na obtenção da KPI de usuários: ${erro.message}`);
                });


            fetch("/dados/dashboard/kpi/equipe", { cache: 'no-store' })
                .then(function (response) {
                    if (response.ok) {
                        response.json().then(function (resposta) {

                            console.log(`Dados KPI Equipe: ${JSON.stringify(resposta)}`);
                            kpiEquipe.innerHTML = resposta[0].nome;

                        });
                    } else {
                        console.error("Erro ao buscar KPI de equipe.");
                    }
                })
                .catch(function (erro) {
                    console.error(`Erro na obtenção da KPI de equipe: ${erro.message}`);
                });


            fetch("/dados/dashboard/kpi/piloto", { cache: 'no-store' })
                .then(function (response) {
                    if (response.ok) {
                        response.json().then(function (resposta) {

                            console.log(`Dados KPI Piloto: ${JSON.stringify(resposta)}`);
                            kpiPiloto.innerHTML = resposta[0].nome;

                        });
                    } else {
                        console.error("Erro ao buscar KPI de piloto.");
                    }
                })
                .catch(function (erro) {
                    console.error(`Erro na obtenção da KPI de piloto: ${erro.message}`);
                });


            fetch("/dados/dashboard/kpi/quiz", { cache: 'no-store' })
                .then(function (response) {
                    if (response.ok) {
                        response.json().then(function (resposta) {

                            console.log(`Dados KPI Quiz: ${JSON.stringify(resposta)}`);
                            kpiQuiz.innerHTML = resposta[0].porcentagem + "%";

                        });
                    } else {
                        console.error("Erro ao buscar KPI do quiz.");
                    }
                })
                .catch(function (erro) {
                    console.error(`Erro na obtenção da KPI do quiz: ${erro.message}`);
                });
        }

        // Funções para puxar dados do Gráfico

        function buscarGraficoEquipes() {

            fetch("/dados/dashboard/grafico/equipe", { cache: 'no-store' })
                .then(function (response) {
                    if (response.ok) {
                        response.json().then(function (resposta) {

                            console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);

                            let nomesEquipes = [];
                            let dados = [];

                            for (let i = 0; i < resposta.length; i++) {

                                let registro = resposta[i];

                                nomesEquipes.push(registro.nome);
                                dados.push(registro.fas);
                            }

                            new Chart(graficoEquipeFavorita, {
                                type: 'bar',
                                data: {
                                    labels: nomesEquipes,
                                    datasets: [{
                                        label: 'Quantidade de Fãs',
                                        data: dados,
                                        backgroundColor: [
                                            '#E10600',
                                            '#FF2D2D',
                                            '#B80000',
                                            '#FF5C5C',
                                            '#8B0000'
                                        ],
                                        borderRadius: 8
                                    }]
                                },
                                options: {
                                    plugins: {
                                        legend: {
                                            labels: {
                                                color: 'white'
                                            }
                                        }
                                    },
                                    scales: {
                                        y: {
                                            ticks: {
                                                color: 'white'
                                            },
                                            grid: {
                                                color: '#2A2A2A'
                                            }
                                        },
                                        x: {
                                            ticks: {
                                                color: 'white'
                                            },
                                            grid: {
                                                color: '#2A2A2A'
                                            }
                                        }
                                    }
                                }
                            });

                        });

                    } else {
                        console.error('Nenhum dado encontrado ou erro na API');
                    }

                })
                .catch(function (erro) {
                    console.error(`Erro na obtenção dos dados do gráfico: ${erro.message}`);
                });
        }


        function buscarGraficoPilotos() {

            fetch("/dados/dashboard/grafico/piloto", { cache: 'no-store' })
                .then(function (response) {
                    if (response.ok) {
                        response.json().then(function (resposta) {

                            console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);

                            let nomePiloto = [];
                            let dados = [];

                            for (let i = 0; i < resposta.length; i++) {

                                let registro = resposta[i];

                                nomePiloto.push(registro.nome);
                                dados.push(registro.fas);
                            }

                            new Chart(graficoPilotoFavorito, {
                                type: 'pie',
                                data: {
                                    labels: nomePiloto,
                                    datasets: [{
                                        data: dados,
                                        backgroundColor: [
                                            '#00A6FF',
                                            '#FFD700',
                                            '#00C853',
                                            '#FF6D00',
                                            '#9C27B0'
                                        ],
                                        borderColor: '#0D0D0D',
                                        borderWidth: 3
                                    }]
                                },
                                options: {
                                    plugins: {
                                        legend: {
                                            labels: {
                                                color: 'white'
                                            }
                                        }
                                    }
                                }
                            });

                        });
                    } else {
                        console.error('Nenhum dado encontrado ou erro na API');
                    }
                })
                .catch(function (erro) {
                    console.error(`Erro na obtenção dos dados do gráfico: ${erro.message}`);
                });
        }


        function buscarGraficoTempo() {

            fetch("/dados/dashboard/grafico/acompanhamento", { cache: 'no-store' })
                .then(function (response) {
                    if (response.ok) {
                        response.json().then(function (resposta) {

                            console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);

                            let labels = [];
                            let dados = [];

                            for (let i = 0; i < resposta.length; i++) {

                                let registro = resposta[i];

                                labels.push(registro.tempo);
                                dados.push(registro.quantidade);
                            }

                            new Chart(graficoTempoAcompanhamento, {
                                type: 'bar',
                                data: {
                                    labels: labels,
                                    datasets: [{
                                        label: 'Quantidade de Fãs',
                                        data: dados,
                                        backgroundColor: [
                                            '#E10600',
                                            '#C40000',
                                            '#A00000',
                                            '#7A0000',
                                            '#550000'
                                        ],
                                        borderRadius: 8
                                    }]
                                },
                                options: {
                                    plugins: {
                                        legend: {
                                            labels: {
                                                color: 'white'
                                            }
                                        }
                                    },
                                    scales: {
                                        y: {
                                            ticks: {
                                                color: 'white'
                                            },
                                            grid: {
                                                color: '#2A2A2A'
                                            }
                                        },
                                        x: {
                                            ticks: {
                                                color: 'white'
                                            },
                                            grid: {
                                                color: '#2A2A2A'
                                            }
                                        }
                                    }
                                }
                            });

                        });
                    } else {
                        console.error('Nenhum dado encontrado ou erro na API');
                    }
                })
                .catch(function (erro) {
                    console.error(`Erro na obtenção dos dados do gráfico: ${erro.message}`);
                });
        }


        let graficoEquipeTempoChart;

        function buscarEquipeTempo() {

            const idAcompanhamento = selectTempo.value;

            fetch(`/dados/dashboard/grafico/equipe-tempo/${idAcompanhamento}`, { cache: 'no-store' })
                .then(function (response) {
                    if (response.ok) {
                        response.json().then(function (resposta) {

                            console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);

                            let nomesEquipes = [];
                            let dados = [];

                            for (let i = 0; i < resposta.length; i++) {

                                let registro = resposta[i];

                                nomesEquipes.push(registro.equipe);
                                dados.push(registro.quantidade);
                            }

                            if (graficoEquipeTempoChart != undefined) {
                                graficoEquipeTempoChart.destroy();
                            }

                            graficoEquipeTempoChart = new Chart(graficoEquipeTempo, {
                                type: 'bar',
                                data: {
                                    labels: nomesEquipes,
                                    datasets: [{
                                        label: 'Quantidade de Fãs',
                                        data: dados,
                                        backgroundColor: [
                                            '#FF1744',
                                            '#F50057',
                                            '#D50000',
                                            '#C51162',
                                            '#AA00FF'
                                        ],
                                        borderRadius: 8
                                    }]
                                },
                                options: {
                                    plugins: {
                                        legend: {
                                            labels: {
                                                color: 'white'
                                            }
                                        }
                                    },
                                    scales: {
                                        y: {
                                            ticks: {
                                                color: 'white'
                                            },
                                            grid: {
                                                color: '#2A2A2A'
                                            }
                                        },
                                        x: {
                                            ticks: {
                                                color: 'white'
                                            },
                                            grid: {
                                                color: '#2A2A2A'
                                            }
                                        }
                                    }
                                }
                            });

                        });
                    } else {
                        console.error('Nenhum dado encontrado ou erro na API');
                    }
                })
                .catch(function (erro) {
                    console.error(`Erro na obtenção dos dados do gráfico: ${erro.message}`);
                });
        }

        function limparSessao() {
            sessionStorage.clear();
        }

    </script>
</body>
</html>
