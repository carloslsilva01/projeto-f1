<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Radar F1</title>
</head>
<body onload="carregar()">
    <main>
        <section class="menu">
            <h2 class="texto-menu">Olá, <span id="nome_usuario">-</span></h2>
            <ul>
                <li><a href="dashboard.html"><strong>Dashboard</strong></a></li>
                <li><a href="">Quiz</a></li>
            </ul>
            <a class="btn-sair" href="index.html">Sair</a>
        </section>
        <section class="container-principal">
            <article class="container-kpi">
                <div class="kpi">Total de fãs do site <span id="kpiTotal">3.000</span></div>
                <div class="kpi">Equipe mais popular <span id="kpiEquipe">Ferrari</span></div>
                <div class="kpi">Piloto do Grid Atual Favorito <span id="kpiPiloto">Charles Leclerc</span></div>
            </article>
            <article class="container-dashboard">
                <div class="grafico">
                    <canvas id="graficoEquipeFavorita"></canvas>
                </div>
                <div class="grafico">
                    <canvas id="graficoPilotoFavorito"></canvas>
                </div>
                <div class="grafico">
                    <canvas id="graficoTempoAcompanhamento"></canvas>
                </div>
                <div class="grafico">
                    <canvas id="graficoEquipeTempo"></canvas>
                </div>
            </article>
        </section>
    </main>
    <script>
        const nome = sessionStorage.getItem('NOME_USUARIO');
        const email = sessionStorage.getItem('EMAIL_USUARIO');
        
        function carregar() {
            const menuNome = document.getElementById('nome_usuario');

            if(nome != null) {
                menuNome.innerHTML = nome;
            } else {
            menuNome.innerHTML = "usuário";
            }
        }
    </script>
</body>
</html>
